<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-label="Zes gekleurde pentominovormen">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#51604b" flood-opacity=".22"/>
    </filter>
    <g id="cell"><rect width="102" height="102" rx="10" stroke="#44564d" stroke-opacity=".22" stroke-width="3"/></g>
  </defs>
  <rect x="8" y="8" width="1238" height="1238" rx="112" fill="#edf1e5"/>
  <rect x="8" y="8" width="1238" height="1238" rx="112" fill="#e4eadb" opacity=".32" filter="url(#paper)"/>

  <g filter="url(#shadow)">
    <!-- L: 4 hoog + 1 opzij -->
    <g transform="translate(165 145)" fill="#4da99f" filter="url(#paper)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="0" y="100"/><use href="#cell" x="0" y="200"/><use href="#cell" x="0" y="300"/><use href="#cell" x="100" y="300"/>
    </g>
    <!-- T: 3 breed + steel van 2 -->
    <g transform="translate(475 180)" fill="#e7ae32" filter="url(#paper)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="100" y="0"/><use href="#cell" x="200" y="0"/><use href="#cell" x="100" y="100"/><use href="#cell" x="100" y="200"/>
    </g>
    <!-- U -->
    <g transform="translate(850 180)" fill="#e97b63" filter="url(#paper)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="200" y="0"/><use href="#cell" x="0" y="100"/><use href="#cell" x="100" y="100"/><use href="#cell" x="200" y="100"/>
    </g>
    <!-- V -->
    <g transform="translate(145 725)" fill="#6ba9cf" filter="url(#paper)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="0" y="100"/><use href="#cell" x="0" y="200"/><use href="#cell" x="100" y="200"/><use href="#cell" x="200" y="200"/>
    </g>
    <!-- P -->
    <g transform="translate(515 700)" fill="#8eaa65" filter="url(#paper)">
      <use href="#cell" x="0" y="0"/><use href="#cell" x="100" y="0"/><use href="#cell" x="0" y="100"/><use href="#cell" x="100" y="100"/><use href="#cell" x="0" y="200"/>
    </g>
    <!-- X -->
    <g transform="translate(875 700)" fill="#a68bc3" filter="url(#paper)">
      <use href="#cell" x="100" y="0"/><use href="#cell" x="0" y="100"/><use href="#cell" x="100" y="100"/><use href="#cell" x="200" y="100"/><use href="#cell" x="100" y="200"/>
    </g>
  </g>
</svg>
