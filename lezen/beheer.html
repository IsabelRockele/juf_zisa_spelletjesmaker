<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Leesabonnementen beheren</title><link rel="stylesheet" href="voorbereiding.css"><link rel="stylesheet" href="account.css"><style>[hidden]{display:none!important}button{background:#ed1764;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#message{min-height:52px}#result{margin-top:24px}</style><script type="module" src="beheer.js?v=1"></script></head><body><header><a class="brand" href="mijn-account.html?test=1">Zisa <span>Lezen</span></a><span class="badge">Beheer · alleen testabonnementen</span></header><main><h1>Leesabonnementen beheren</h1><p>Zoek een aankoper op om op diens verzoek de automatische verlenging te stoppen. De betaalde toegang blijft behouden. Bij een school geldt de opzegging voor alle leerkrachtplaatsen.</p><p id="message" role="status">Beheer wordt geladen…</p><button id="login" hidden>Aanmelden met Google als beheerder</button><button id="logout" hidden>Afmelden</button><section id="management" hidden><form id="search" class="card"><label for="email">E-mailadres van de aankoper</label><input id="email" type="email" required autocomplete="off"><button>Abonnement zoeken</button></form><section id="result" class="card" hidden><h2 id="buyer"></h2><p id="details"></p><p id="state"></p><form id="cancelForm"><label class="consent"><input id="requested" type="checkbox" required>De aankoper heeft mij gevraagd dit abonnement op te zeggen.</label><button id="cancel" type="submit">Automatische verlenging stoppen</button></form></section></section></main></body></html>
