  <style>
    @font-face{font-family:Zisa;src:url('../../assets/fonts/Nunito-Variable.ttf') format('truetype');font-display:swap}
    [hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#fff9ed;color:#38314b;font-family:Zisa,Arial,sans-serif;text-align:center;padding:18px}main{max-width:680px;margin:auto;background:white;border:2px solid #e4d9f3;border-radius:28px;padding:20px 24px}h1{font-size:clamp(28px,5vw,42px);margin:4px 0 10px;color:#59438c}p{font-size:20px;line-height:1.5;margin:10px 0}.music{font-size:30px;color:#8a61c2}.qr{display:block;width:min(100%,320px);height:auto;margin:12px auto}.steps{max-width:450px;margin:8px auto 16px;text-align:left;font-size:20px;line-height:1.7;padding-left:30px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}button,.actions a{font:700 17px Zisa,Arial,sans-serif;background:#6047aa;color:white;border:0;border-radius:14px;padding:14px 20px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #cb8600;outline-offset:4px}.link{display:block;margin-top:20px;font-size:15px;color:#59438c;overflow-wrap:anywhere}.note{font-size:15px;color:#716781;margin-top:22px}@media print{body{background:white;padding:0}main{border:0}.actions,.note{display:none}main{max-width:100%}.qr{width:105mm}h1{font-size:32pt}}

<body><main>
